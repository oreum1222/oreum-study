<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>고전 문법 복습 시험 · 김가경 국어 연구소</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c10;--card:#0f1626;--card2:#101a2c;--line:rgba(148,163,190,.16);--line2:rgba(148,163,190,.3);--mint:#4ae3c0;--mint2:#3ec4a8;--mint-soft:rgba(74,227,192,.10);--silver:#e6ebf3;--silver2:#a7b1c5;--muted:#6a7488;--serif:'Nanum Myeongjo',serif;--num:'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box;word-break:keep-all}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--silver);line-height:1.65;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:44px 18px 60px}
.back{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;text-decoration:none;margin-bottom:28px;transition:.2s}
.back:hover{color:var(--silver2)}
.back .material-symbols-outlined{font-size:18px}
.head{text-align:center;margin-bottom:34px}
.badge{display:inline-block;font-family:var(--serif);font-weight:800;font-size:12px;letter-spacing:.5px;color:#06251f;background:linear-gradient(135deg,var(--mint2),var(--mint));padding:5px 12px;border-radius:6px;margin-bottom:16px}
.title{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:-.5px}
.title b{color:var(--mint)}
.sub{font-size:14px;color:var(--muted);margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.crd{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 22px;text-decoration:none;color:inherit;transition:.2s;position:relative;overflow:hidden}
.crd::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--mint);opacity:.7}
.crd:hover{border-color:var(--mint);box-shadow:0 0 28px var(--mint-soft);transform:translateY(-2px)}
.ic{width:46px;height:46px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.ic .material-symbols-outlined{font-size:24px;color:var(--mint)}
.ct{font-family:var(--serif);font-size:20px;font-weight:700;margin-bottom:5px}
.cg{font-size:13px;color:var(--muted)}
.cta{display:inline-flex;align-items:center;gap:4px;margin-top:16px;font-size:13px;font-weight:600;color:var(--mint)}
.cta .material-symbols-outlined{font-size:17px}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:400;line-height:1}
@media(max-width:560px){.grid{grid-template-columns:1fr}.title{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html"><span class="material-symbols-outlined">arrow_back</span> 김가경 국어 연구소</a>
  <div class="head">
    <div class="badge">김가경 국어 연구소</div>
    <div class="title">고전 문법 <b>복습 시험</b></div>
    <div class="sub">중세 국어 · 단어별 문법 분석</div>
  </div>
  <div class="grid">
    <a class="crd" id="c1" href="hunmin.html">
      <div class="ic"><span class="material-symbols-outlined">translate</span></div>
      <div class="ct">세종어제훈민정음</div>
      <div class="cg">44단어 · 78문항</div>
      <div class="cta">시험 보기 <span class="material-symbols-outlined">arrow_forward</span></div>
    </a>
    <a class="crd" id="c2" href="yongbi.html">
      <div class="ic"><span class="material-symbols-outlined">history_edu</span></div>
      <div class="ct">용비어천가</div>
      <div class="cg">48단어 · 70문항</div>
      <div class="cta">시험 보기 <span class="material-symbols-outlined">arrow_forward</span></div>
    </a>
  </div>
</div>
<script>
// 캐시 최소화: 링크에 버전 파라미터
document.querySelectorAll('.crd').forEach(function(a){ a.href = a.getAttribute('href') + '?v=' + Date.now(); });
</script>
</body>
</html>
