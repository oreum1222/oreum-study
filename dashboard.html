<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>가경T 대시보드 · 김가경 국어 연구소</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap');
:root{--bg:#0a0c10;--bg-card:#0f1626;--bg-card2:#101a2c;--border:rgba(148,163,190,.16);--border-h:rgba(148,163,190,.3);--green:#2f6d5e;--green-a:#3ec4a8;--green-l:#4ae3c0;--green-b:#5ec97e;--gold:#4ae3c0;--text:#e6ebf3;--text2:#a7b1c5;--text3:#6a7488;--text4:#525c72;--red:#e06a6a;--orange:#a7b1c5;--blue:#8194b4;--mint:#4ae3c0;--radius:12px}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:400;font-size:17px;line-height:1;vertical-align:-3px;margin-right:2px}
*{margin:0;padding:0;box-sizing:border-box;word-break:keep-all;overflow-wrap:break-word}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.app{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
.dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:16px}
.dash-brand{display:flex;align-items:center;gap:14px}
.dash-badge{background:linear-gradient(135deg,var(--green),var(--green-a));color:#06251f;font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:13px;padding:6px 12px;border-radius:6px}
.dash-title{font-family:'Nanum Myeongjo',serif;font-size:24px;font-weight:900}
.dash-title span{color:var(--gold)}
.dash-sub{font-size:12px;color:var(--text3)}
.dash-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text3);font-size:12px;font-family:'Noto Sans KR',sans-serif;padding:8px 16px;border-radius:8px;cursor:pointer;transition:all .2s}
.dash-btn:hover{border-color:var(--border-h);color:var(--text)}
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.summary-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.summary-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.summary-card.c1::before,.summary-card.c2::before,.summary-card.c3::before,.summary-card.c4::before{background:var(--mint);opacity:.7}
.summary-label{font-size:12px;color:var(--text3);margin-bottom:6px;font-weight:500}
.summary-value{font-size:28px;font-weight:700;letter-spacing:-.5px}
.summary-sub{font-size:12px;color:var(--text4);margin-top:4px}
.section{margin-bottom:28px}
.section-head{margin-bottom:14px}
.section-title{font-family:'Nanum Myeongjo',serif;font-size:17px;font-weight:700}
.table-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
thead{background:var(--bg-card2)}
th{padding:12px 16px;text-align:left;font-weight:600;font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04)}
tr:hover td{background:rgba(255,255,255,.02)}
tr:last-child td{border-bottom:none}
.rank{font-weight:700;color:var(--gold);width:40px;text-align:center}
.rank.top1{color:var(--mint,#4ae3c0);font-size:16px}.rank.top2{color:#c0c0c0}.rank.top3{color:#cd7f32}
.name-cell{font-weight:600}
.rate-cell{font-weight:700}.rate-cell.high{color:var(--mint)}.rate-cell.mid{color:var(--text2)}.rate-cell.low{color:var(--red)}
.grade{display:inline-block;width:28px;height:28px;border-radius:6px;text-align:center;line-height:28px;font-weight:700;font-size:12px}
.grade-A,.grade-B{background:rgba(74,227,192,.12);color:var(--mint)}.grade-C,.grade-D{background:rgba(167,177,197,.12);color:var(--text2)}.grade-F{background:rgba(224,106,106,.14);color:var(--red)}
.st{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700}
.st-pass{background:rgba(74,227,192,.14);color:var(--mint)}
.st-fail{background:rgba(224,106,106,.14);color:var(--red)}
.st-absent{background:rgba(167,177,197,.12);color:var(--text2)}
.work-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.work-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.work-card:hover{border-color:var(--border-h)}
.work-name{font-size:14px;font-weight:600;margin-bottom:4px}
.work-bar-bg{height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;margin-bottom:6px}
.work-bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
.work-stats{display:flex;justify-content:space-between;font-size:12px;color:var(--text3)}
.work-stats .rate{font-weight:700}
.missing-alert{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:var(--radius);padding:20px;margin-bottom:28px}
.missing-title{font-size:15px;font-weight:700;color:var(--red);margin-bottom:12px}
.missing-grid{display:flex;flex-wrap:wrap;gap:8px}
.missing-tag{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:6px;padding:6px 12px;font-size:13px}
.missing-tag .sch{font-size:11px;color:var(--text4);margin-left:4px}
.class-bar{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.cls-btn{display:inline-flex;align-items:center;gap:6px;background:var(--bg-card);border:1px solid var(--border);color:var(--text2);font-size:14px;font-weight:600;font-family:'Noto Sans KR',sans-serif;padding:9px 16px;border-radius:10px;cursor:pointer;transition:all .18s}
.cls-btn:hover{border-color:var(--border-h);color:var(--text)}
.cls-btn.on{background:var(--green-a);border-color:var(--green-a);color:#06251f}
.cls-btn.on .cls-cnt{background:rgba(6,37,31,.18);color:#06251f}
.cls-cnt{font-size:12px;font-weight:700;background:var(--bg-card2);color:var(--text3);padding:2px 8px;border-radius:20px}
.week-bar{display:flex;align-items:center;gap:8px;margin:-8px 0 24px;flex-wrap:wrap}
.week-lbl{font-size:12px;color:var(--text4);margin-right:2px}
.wk-btn{background:transparent;border:1px solid var(--border);color:var(--text3);font-size:13px;font-weight:600;font-family:'Noto Sans KR',sans-serif;padding:6px 15px;border-radius:20px;cursor:pointer;transition:.15s}
.wk-btn:hover{border-color:var(--border-h);color:var(--text)}
.wk-btn.on{background:var(--mint);border-color:var(--mint);color:#06251f}
.tab-row{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:10px 18px;font-size:13px;color:var(--text4);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
.tab:hover{color:var(--text2)}.tab.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}
.tab-content{display:none}.tab-content.active{display:block}
.time-chart{display:flex;align-items:flex-end;gap:3px;height:140px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 12px 12px}
.time-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.time-bar{width:100%;background:var(--green-a);border-radius:3px 3px 0 0;min-height:1px;transition:height .5s}
.time-lbl{font-size:9px;color:var(--text4)}.time-cnt{font-size:9px;color:var(--text3);font-weight:600}
.growth-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.growth-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.growth-hd{display:flex;justify-content:space-between;margin-bottom:10px}
.growth-nm{font-weight:600;font-size:14px}
.growth-bars{display:flex;align-items:flex-end;gap:6px;height:70px}
.growth-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.growth-v{font-size:11px;font-weight:700}
.growth-b{width:100%;border-radius:3px;opacity:.75}
.growth-d{font-size:9px;color:var(--text4)}
.retry-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.retry-card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.retry-nm{font-weight:600;font-size:13px;margin-bottom:4px}
.retry-cnt{font-size:24px;font-weight:700;color:var(--gold)}
.retry-lb{font-size:11px;color:var(--text4)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--bg-card);border:1px solid var(--border-h);border-radius:16px;padding:32px;max-width:650px;width:90%;max-height:80vh;overflow-y:auto}
.modal h3{font-family:'Nanum Myeongjo',serif;font-size:20px;margin-bottom:4px}
.modal .msub{font-size:13px;color:var(--text3);margin-bottom:20px}
.modal-table{width:100%;font-size:13px}
.modal-table th{font-size:11px;padding:8px 12px}.modal-table td{padding:8px 12px}
.wrong-list{font-size:11px;color:var(--red);max-width:180px;word-break:break-all}
.loading{text-align:center;padding:60px;color:var(--text3)}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--green-a);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){.summary-row{grid-template-columns:repeat(2,1fr)}.work-grid,.growth-grid,.retry-grid{grid-template-columns:1fr}.summary-value{font-size:22px}th,td{padding:8px 10px;font-size:12px}.tab{padding:8px 12px;font-size:12px}}
@media(max-width:480px){.summary-row{grid-template-columns:1fr}}
.sms-box{background:var(--bg-card2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px}
.sms-inp{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:12px;font-family:inherit}
.sms-chips{display:flex;flex-wrap:wrap;gap:6px;max-height:170px;overflow:auto;padding:2px}
.sms-chip{font-size:12px;padding:6px 12px;border:1px solid var(--border);border-radius:20px;cursor:pointer;color:var(--text3);user-select:none;transition:.15s}
.sms-chip.on{background:rgba(62,196,168,.16);border-color:var(--green-a);color:var(--mint)}
.sms-rad{font-size:12px;color:var(--text3);cursor:pointer;display:flex;align-items:center;gap:5px}
.dash-btn.sm{padding:5px 10px;font-size:11px}
.dash-btn.primary{background:var(--green-a);color:#06251f;border-color:var(--green-a);font-weight:700;display:inline-flex;align-items:center;gap:4px}
.dash-btn.primary .material-symbols-outlined{font-size:16px}
.sms-pre{white-space:pre-wrap;background:var(--bg-card2);border:1px solid var(--border);border-radius:8px;padding:14px;font-size:12px;font-family:inherit;line-height:1.7;margin:0;max-height:220px;overflow:auto;color:var(--text2)}
</style>
</head>
<body>
<div class="app" id="app"><div class="loading"><div class="spinner"></div><div>데이터를 불러오는 중...</div></div></div>
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)"><div class="modal" id="mc"></div></div>
<div class="modal-overlay" id="smsOverlay" onclick="if(event.target.id==='smsOverlay')smsClose()"><div class="modal" id="smsc" style="max-width:720px"></div></div>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbz7CrlG8u1xTzQOQ_cyUwXC8_cqhx_mhUVHXG8tulb2PPsjdFTid0r_1JAgc0C9JVw05Q/exec';
let ROSTERS={};       // {반이름:[{name,school}]} — 시트 명단 마커 행에서 로드(공개 저장소엔 개인정보 미포함)
let currentClass='';  // '' = 전체 반
let currentWeek='';   // '' = 전체 주차
// 반별 주차→작품 매핑(시트 저장 작품명과 정확히 일치). 주차 추가 시 여기에 반영.
const WEEKMAP={
  '고1 단과':{
    '1주차':['백수광부의 아내 - 공무도하가','유리왕 - 황조가','작자 미상 - 구지가','작자 미상 - 정읍사'],
    '2주차':['충담사 - 찬기파랑가 (김완진 해독)','충담사 - 찬기파랑가 (양주동 해독)','월명사 - 제망매가']
  },
  '오름 고전문법':{
    '세종어제훈민정음':['세종어제훈민정음(고전문법)'],
    '용비어천가':['용비어천가(고전문법)'],
    '소학언해':['소학언해(고전문법)']
  },
  '고1 종합':{
    '세종어제훈민정음':['세종어제훈민정음(고전문법)'],
    '용비어천가':['용비어천가(고전문법)']
  }
};
const WEEKLABEL={'오름 고전문법':'시험','고1 종합':'시험'};  // 주차 바 라벨(기본 '주차')
let rawData=[],students={},workStats={},BAEKJI={};  // BAEKJI: 백지 복습(통과/불통/결석) 결과

async function loadData(){
  try{const r=await fetch(SCRIPT_URL+'?mode=data');const j=await r.json();if(j.error)throw j.error;rawData=j.rows||[];processData();renderAll();}
  catch(e){console.error(e);document.getElementById('app').innerHTML='<div style="text-align:center;padding:60px;color:var(--text4)">데이터를 불러올 수 없습니다. <button class="dash-btn" style="margin-top:12px" onclick="loadData()">다시 시도</button></div>';}
}

function processData(){
  students={};workStats={};ROSTERS={};BAEKJI={};
  const rmk={};
  rawData.forEach(row=>{
    const w=String(row.work||''), nm=String(row.name||'');
    if(w.indexOf('【명단】')===0){
      const cls=w.replace('【명단】','').trim();
      const list=String(row.wrongs||'').split(',').map(s=>s.trim()).filter(s=>s.indexOf('|')>=0).map(s=>{const p=s.split('|');return{name:p[0].trim(),school:(p[1]||'').trim()};});
      if(list.length&&(!rmk[cls]||row.time>rmk[cls].time))rmk[cls]={time:row.time,list};
    }
    if(w==='【백지결과】'&&nm.indexOf('【백지:')===0){
      const key=nm.replace('【백지:','').replace('】','').trim(); const parts=key.split('|');
      const cls=parts[0].trim(), week=(parts[1]||'결과').trim();
      const list=String(row.wrongs||'').split(',').map(s=>s.trim()).filter(s=>s.split('|').length>=2).map(s=>{const p=s.split('|');return{name:p[0].trim(),status:(p[1]||'').trim(),note:(p[2]||'').trim()};});
      if(list.length){if(!BAEKJI[cls])BAEKJI[cls]={};if(!BAEKJI[cls][week]||row.time>BAEKJI[cls][week].time)BAEKJI[cls][week]={time:row.time,list};}
    }
  });
  Object.keys(rmk).forEach(c=>ROSTERS[c]=rmk[c].list);
  rawData.forEach(row=>{
    const n=String(row.name||'').trim();if(!n||n.indexOf('【')===0)return;
    if(!students[n])students[n]={latest:'',subs:[]};
    if(row.time>students[n].latest)students[n].latest=row.time;
    students[n].subs.push(row);
  });
  Object.keys(students).forEach(n=>{
    const st=students[n];
    // 작품별 최신 점수
    const wm={};
    st.subs.forEach(s=>{if(s.work!=='【전체 요약】'){if(!wm[s.work]||s.time>wm[s.work].time)wm[s.work]=s;}});
    st.works=Object.values(wm);
    let tc=0,tb=0;
    st.works.forEach(w=>{tc+=Number(w.correct)||0;tb+=Number(w.total)||0;});
    st.summary={correct:tc,total:tb,rate:tb?Math.round(tc/tb*100):0};
    // 성장 추이: 제출 날짜별
    const gm={};
    st.subs.filter(s=>s.work==='【전체 요약】').forEach(s=>{
      const d=s.time.split(' ').slice(0,3).join(' ');
      if(!gm[d]||s.time>gm[d].time)gm[d]=s;
    });
    st.growth=Object.values(gm).sort((a,b)=>a.time>b.time?1:-1).map(s=>({date:s.time.split(' ').slice(0,3).join(' '),rate:Number(s.rate)||0,correct:Number(s.correct)||0,total:Number(s.total)||0}));
    // 재응시 횟수
    const dates=new Set();st.subs.filter(s=>s.work==='【전체 요약】').forEach(s=>dates.add(s.time.split(' ').slice(0,3).join(' ')));
    st.retries=dates.size;
  });
  // 작품별 통계
  Object.values(students).forEach(st=>{
    st.works.forEach(w=>{
      if(!workStats[w.work])workStats[w.work]={sumRate:0,count:0,wrongMap:{}};
      const ws=workStats[w.work];ws.count++;ws.sumRate+=Number(w.rate)||0;
      if(w.wrongs)w.wrongs.split(',').map(s=>s.trim()).filter(s=>s).forEach(wr=>{ws.wrongMap[wr]=(ws.wrongMap[wr]||0)+1;});
    });
  });
}

function renderAll(){
  const clsList=Object.keys(ROSTERS);
  if(!currentClass||clsList.indexOf(currentClass)<0)currentClass=clsList[0]||'';
  const allNames=Object.keys(students);
  const roster=currentClass?(ROSTERS[currentClass]||[]):Object.values(ROSTERS).flat();
  const rosterNames=new Set(roster.map(r=>r.name));
  // 백지 복습 반(점수 없음) 또는 백지 주차 선택 시 → 백지 뷰
  const bjWeeks=BAEKJI[currentClass]?Object.keys(BAEKJI[currentClass]):[];
  const hasScore=allNames.some(n=>rosterNames.has(n)&&(students[n].works||[]).some(w=>String(w.work).indexOf('【')!==0));
  if(bjWeeks.length&&(!hasScore||bjWeeks.indexOf(currentWeek)>=0)){renderBaekji();return;}
  const names=currentClass?allNames.filter(n=>rosterNames.has(n)):allNames;
  // 주차 필터: 유효성 확인 + 주차별 뷰 계산
  const weeks=WEEKMAP[currentClass]?Object.keys(WEEKMAP[currentClass]):[];
  if(currentWeek&&weeks.indexOf(currentWeek)<0)currentWeek='';
  const cmap=WEEKMAP[currentClass];
  const clsWorks=cmap?new Set(Object.values(cmap).flat()):null;  // 이 반에 등록된 전체 작품
  const inWk=(work)=>{ if(currentWeek){ return !!(cmap&&cmap[currentWeek]&&cmap[currentWeek].indexOf(work)>=0); } return clsWorks?clsWorks.has(work):true; };  // 전체=이 반 주차 작품만(타 반 작품 유입 차단)
  const view={};
  names.forEach(n=>{
    const ws=(students[n].works||[]).filter(w=>String(w.work).indexOf('【명단】')!==0 && inWk(w.work));
    let tc=0,tb=0;ws.forEach(w=>{tc+=Number(w.correct)||0;tb+=Number(w.total)||0;});
    view[n]={works:ws,summary:{correct:tc,total:tb,rate:tb?Math.round(tc/tb*100):0},has:ws.length>0};
  });
  const takers=names.filter(n=>view[n].has);
  const missing=roster.filter(r=>!(view[r.name]&&view[r.name].has));
  // 작품 통계(선택 반·주차 기준)
  const wStats={};
  takers.forEach(n=>{view[n].works.forEach(w=>{
    if(!wStats[w.work])wStats[w.work]={sumRate:0,count:0,wrongMap:{}};
    const ws=wStats[w.work];ws.count++;ws.sumRate+=Number(w.rate)||0;
    if(w.wrongs)String(w.wrongs).split(',').map(s=>s.trim()).filter(Boolean).forEach(wr=>{ws.wrongMap[wr]=(ws.wrongMap[wr]||0)+1;});
  });});

function sw(i){document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',j===i));document.querySelectorAll('.tab-content').forEach((t,j)=>t.classList.toggle('active',j===i));}
function setClass(c){currentClass=c;currentWeek='';renderAll();}

function classParticipants(c){
  const rn=new Set((ROSTERS[c]||[]).map(r=>r.name)); const set=new Set();
  Object.keys(students).forEach(n=>{if(rn.has(n)&&(students[n].works||[]).some(w=>String(w.work).indexOf('【')!==0))set.add(n);});
  if(BAEKJI[c])Object.values(BAEKJI[c]).forEach(o=>o.list.forEach(x=>{if(rn.has(x.name))set.add(x.name);}));
  return set.size;
}

function showSt(name){
  const st=students[name];if(!st)return;
  const _cm=WEEKMAP[currentClass], _cw=_cm?new Set(Object.values(_cm).flat()):null;
  const wks=(st.works||[]).filter(w=>String(w.work).indexOf('【명단】')!==0 && (currentWeek?((_cm||{})[currentWeek]||[]).indexOf(w.work)>=0:(_cw?_cw.has(w.work):true)));
  let tc=0,tb=0;wks.forEach(w=>{tc+=Number(w.correct)||0;tb+=Number(w.total)||0;});
  const r=tb?Math.round(tc/tb*100):0;
  const g=r>=90?'A':r>=80?'B':r>=70?'C':r>=60?'D':'F';
  document.getElementById('mc').innerHTML=`
    <h3>${name}</h3>
    <div class="msub">최근: ${st.latest} · 누적: <strong style="color:${r>=80?'var(--green-b)':r>=60?'var(--orange)':'var(--red)'}">${tc}/${tb} (${r}%)</strong> · <span class="grade grade-${g}" style="display:inline-block;vertical-align:middle">${g}</span>${currentWeek?' · '+currentWeek:''}</div>
    <table class="modal-table"><thead><tr><th>작품</th><th>정답</th><th>빈칸</th><th>정답률</th><th>오답</th><th>제출일</th></tr></thead><tbody>
    ${wks.map(w=>{const wr=Number(w.rate)||0;return `<tr><td style="font-weight:500">${w.work}</td><td>${w.correct}</td><td>${w.total}</td><td class="rate-cell ${wr>=80?'high':wr>=60?'mid':'low'}">${wr}%</td><td class="wrong-list">${w.wrongs||'-'}</td><td style="font-size:11px;color:var(--text4)">${w.time?w.time.split(' ').slice(0,3).join(' '):''}</td></tr>`;}).join('')}
    </tbody></table>
    ${(st.growth||[]).length>1?`<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)"><div style="font-size:12px;color:var(--text3);margin-bottom:8px"><span class="material-symbols-outlined">trending_up</span> 성장 추이</div><div style="display:flex;gap:10px;align-items:flex-end">${st.growth.map(p=>{const c=p.rate>=80?'var(--green-b)':p.rate>=60?'var(--orange)':'var(--red)';return `<div style="text-align:center;flex:1"><div style="font-size:13px;font-weight:700;color:${c}">${p.rate}%</div><div style="height:${Math.max(6,p.rate*.5)}px;background:${c};border-radius:3px;margin:4px 0;opacity:.7"></div><div style="font-size:10px;color:var(--text4)">${p.date.replace(/2026\.\s*/,'')}</div></div>`;}).join('')}</div></div>`:''}
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function smsK(){return SMS_KEY?'&key='+encodeURIComponent(SMS_KEY):'';}
function smsSaveUrl(){SMS_URL=document.getElementById('smsUrl').value.trim();SMS_KEY=document.getElementById('smsKey').value.trim();localStorage.setItem('SMS_URL',SMS_URL);localStorage.setItem('BOKSUP_KEY',SMS_KEY);if(SMS_URL){smsSetStat('저장됨. 목록 불러오는 중…');smsLoadList();}else smsSetStat('URL을 입력하세요.',false);}
function smsPing(){if(!SMS_URL){smsSetStat('URL을 먼저 입력·저장하세요.',false);return;}smsSetStat('확인 중…');smsFetch('action=boksup&op=ping').then(function(j){smsSetStat(j.ok?'연결됨 · 등록 학생 '+j.total+'명'+(j.hasKeys?' · 발송 준비됨':' · 발송키 미설정(테스트만)'):'응답 오류: '+(j.error||''),!!j.ok);}).catch(function(e){smsSetStat('연결 실패: '+e,false);});}
function smsLoadList(){smsFetch('action=boksup&op=list'+smsK()).then(function(j){if(!j.ok){smsSetStat('목록 오류: '+(j.error||'관리키 확인'),false);return;}smsNames=j.names;smsSel={};smsNames.forEach(function(n){smsSel[n]=true;});smsSetStat('연결됨 · 등록 학생 '+smsNames.length+'명',true);smsRenderBody();}).catch(function(e){smsSetStat('목록 실패: '+e,false);});}
function smsTarget(){var r=document.querySelector('input[name=smsTgt]:checked');return r?r.value:'both';}
function smsCnt(){var e=document.getElementById('smsCnt');if(!e)return;var n=smsNames.filter(function(x){return smsSel[x];}).length;e.textContent='('+n+'/'+smsNames.length+' 선택)';}
function smsToggle(n,el){smsSel[n]=el.checked;el.parentElement.classList.toggle('on',el.checked);smsCnt();}
function smsAll(v){smsNames.forEach(function(n){smsSel[n]=!!v;});document.querySelectorAll('#smsBody .sms-chip').forEach(function(l){l.classList.toggle('on',!!v);l.querySelector('input').checked=!!v;});smsCnt();}
function smsRenderBody(){
  var b=document.getElementById('smsBody');if(!smsNames.length){b.innerHTML='<div style="color:var(--text4);font-size:13px">등록된 학생이 없습니다.</div>';return;}
  var chips=smsNames.map(function(n){return '<label class="sms-chip on"><input type="checkbox" checked onchange="smsToggle(\''+n+'\',this)" style="display:none">'+n+'</label>';}).join('');
  var opts=smsNames.map(function(n){return '<option>'+n+'</option>';}).join('');
  b.innerHTML=`
   <div style="display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
     <div style="font-size:13px;font-weight:600">대상</div>
     <label class="sms-rad"><input type="radio" name="smsTgt" value="both" checked onchange="smsPreview()"> 학부모+학생</label>
     <label class="sms-rad"><input type="radio" name="smsTgt" value="parent" onchange="smsPreview()"> 학부모만</label>
     <label class="sms-rad"><input type="radio" name="smsTgt" value="student" onchange="smsPreview()"> 학생만</label>
   </div>
   <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
     <div style="font-size:13px;font-weight:600">학생 <span id="smsCnt" style="color:var(--text3);font-weight:400"></span></div>
     <div style="display:flex;gap:6px"><button class="dash-btn sm" onclick="smsAll(1)">전체</button><button class="dash-btn sm" onclick="smsAll(0)">해제</button></div>
   </div>
   <div class="sms-chips">${chips}</div>
   <div style="margin:16px 0 8px;font-size:13px;font-weight:600">미리보기</div>
   <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
     <select id="smsPrevName" onchange="smsPreview()" style="padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:12px">${opts}</select>
     <span style="font-size:12px;color:var(--text4)">대상 선택에 따라 문구가 바뀝니다</span>
   </div>
   <pre id="smsPrev" class="sms-pre"></pre>
   <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
     <button class="dash-btn" onclick="smsSend(true)">테스트(발송 안 함)</button>
     <button class="dash-btn primary" onclick="smsSend(false)"><span class="material-symbols-outlined">send</span> 실제 발송</button>
   </div>
   <div id="smsResult" style="margin-top:14px;font-size:12px;line-height:1.6"></div>`;
  smsCnt();smsPreview();
}
function smsPreview(){
  var nameEl=document.getElementById('smsPrevName');if(!nameEl)return;var name=nameEl.value,t=smsTarget(),pre=document.getElementById('smsPrev');pre.textContent='불러오는 중…';
  if(t==='both'){Promise.all([smsFetch('action=boksup&op=preview&target=parent&name='+encodeURIComponent(name)+smsK()),smsFetch('action=boksup&op=preview&target=student&name='+encodeURIComponent(name)+smsK())]).then(function(r){var p=r[0],s=r[1];pre.textContent='[학부모]\n'+(p.ok?p.text:'('+(p.error||'없음')+')')+'\n\n──────────\n\n[학생]\n'+(s.ok?s.text:'('+(s.error||'없음')+')');});}
  else{smsFetch('action=boksup&op=preview&target='+t+'&name='+encodeURIComponent(name)+smsK()).then(function(j){pre.textContent=j.ok?j.text:'('+(j.error||'없음')+')';});}
}
function smsSend(dry){
  var sel=smsNames.filter(function(n){return smsSel[n];});if(!sel.length){alert('선택된 학생이 없습니다.');return;}
  var t=smsTarget(),tl={both:'학부모+학생',parent:'학부모',student:'학생'}[t];
  if(!dry&&!confirm(sel.length+'명에게 실제 문자를 발송합니다.\n대상: '+tl+'\n\n계속할까요?'))return;
  var res=document.getElementById('smsResult');res.style.color='var(--text3)';res.textContent=dry?'테스트 중…':'발송 중…';
  var names=sel.map(encodeURIComponent).join(',');
  smsFetch('action=boksup&op=send&target='+t+'&dryRun='+(dry?'1':'0')+'&names='+names+smsK()).then(function(j){
    if(!j.ok){res.style.color='var(--red)';res.innerHTML='실패: '+smsEsc(j.error||JSON.stringify(j))+(j.skipped&&j.skipped.length?'<br>제외: '+smsEsc(j.skipped.join(', ')):'');return;}
    if(j.dryRun){res.style.color='var(--mint)';res.innerHTML='✓ 테스트 성공 · 실제 발송 시 <b>'+j.count+'건</b> 전송됩니다.'+(j.skipped&&j.skipped.length?'<br><span style="color:var(--text3)">제외 '+j.skipped.length+'건: '+smsEsc(j.skipped.join(', '))+'</span>':'');}
    else{res.style.color='var(--mint)';res.innerHTML='✓ 발송 완료 · <b>'+j.count+'건</b> (응답코드 '+j.code+')'+(j.skipped&&j.skipped.length?'<br><span style="color:var(--text3)">제외 '+j.skipped.length+'건: '+smsEsc(j.skipped.join(', '))+'</span>':'');}
  }).catch(function(e){res.style.color='var(--red)';res.textContent='오류: '+e;});
}

loadData();
</script>
</body>
</html>
