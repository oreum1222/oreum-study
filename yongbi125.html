<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>용비어천가 125장 복습 시험 · 김가경 국어 연구소</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c10;--card:#0f1626;--card2:#101a2c;--line:rgba(148,163,190,.16);--line2:rgba(148,163,190,.3);--mint:#4ae3c0;--mint2:#3ec4a8;--mint-soft:rgba(74,227,192,.10);--mint-glow:rgba(74,227,192,.28);--silver:#e6ebf3;--silver2:#a7b1c5;--muted:#6a7488;--dim:#525c72;--correct:#5ec97e;--wrong:#e06a6a;--serif:'Nanum Myeongjo',serif;--num:'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box;word-break:keep-all;overflow-wrap:break-word}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--silver);line-height:1.65;padding-bottom:120px}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px}
.head{text-align:center;margin-bottom:26px}
.badge{display:inline-block;font-family:var(--serif);font-weight:800;font-size:12px;letter-spacing:.5px;color:#06251f;background:linear-gradient(135deg,var(--mint2),var(--mint));padding:5px 12px;border-radius:6px;margin-bottom:14px}
.title{font-family:var(--serif);font-size:26px;font-weight:800;letter-spacing:-.5px}
.title b{color:var(--mint)}
.sub{font-size:13px;color:var(--muted);margin-top:6px}
.namebar{display:flex;align-items:center;gap:10px;justify-content:center;margin:20px auto 0;max-width:420px}
.namebar input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--silver);font-size:15px;font-family:inherit;outline:none;transition:.2s}
.namebar input:focus{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint-soft)}
.word{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px}
.wordhd{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.wordno{font-family:var(--num);font-weight:700;font-size:13px;color:#06251f;background:var(--mint);width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.wordlbl{font-size:13px;color:var(--muted)}
.imgbox{background:#fff;border-radius:12px;padding:18px 22px;text-align:center;margin-bottom:20px}
.imgbox img{max-width:100%;max-height:110px;object-fit:contain}
.q{padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:none;padding-top:0}
.qtitle{font-size:15px;font-weight:500;margin-bottom:11px;white-space:pre-line}
.qtitle .qt{font-family:var(--num);font-size:11px;font-weight:700;color:var(--mint);border:1px solid var(--mint);border-radius:5px;padding:1px 6px;margin-right:7px;vertical-align:2px}
.sa input{width:100%;max-width:340px;background:var(--card2);border:1px solid var(--line2);border-radius:9px;padding:10px 13px;color:var(--silver);font-size:15px;font-family:inherit;outline:none;transition:.18s}
.sa input:focus{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint-soft)}
.sa input.correct{border-color:var(--correct);background:rgba(94,201,126,.1);color:var(--correct)}
.sa input.wrong{border-color:var(--wrong);background:rgba(224,106,106,.1);color:var(--wrong)}
.ansfb{font-size:13px;margin-top:7px;color:var(--muted);display:none}
.ansfb.show{display:block}
.ansfb .ok{color:var(--correct)}.ansfb .no{color:var(--wrong)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;transition:.15s;font-size:14px}
.opt:hover{border-color:var(--line2)}
.opt .box{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.15s}
.opt .box .material-symbols-outlined{font-size:15px;color:#06251f;opacity:0}
.opt.on{border-color:var(--mint);background:var(--mint-soft)}
.opt.on .box{background:var(--mint);border-color:var(--mint)}
.opt.on .box .material-symbols-outlined{opacity:1}
.opt.graded{cursor:default}
.opt.gc{border-color:var(--correct);background:rgba(94,201,126,.12)}
.opt.gc .box{background:var(--correct);border-color:var(--correct)}
.opt.gw{border-color:var(--wrong);background:rgba(224,106,106,.12)}
.opt.gw .box{background:var(--wrong);border-color:var(--wrong)}
.opt .miss{margin-left:auto;font-size:11px;font-weight:600;color:var(--correct);align-self:center}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:400;line-height:1}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,12,16,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:14px 18px;z-index:50}
.barwrap{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:16px}
.prog{display:flex;align-items:center;gap:10px}
.ring{width:42px;height:42px}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--mint);stroke-linecap:round;transition:stroke-dasharray .4s}
.progtxt{font-family:var(--num);font-weight:700;font-size:15px}
.proglbl{font-size:12px;color:var(--muted)}
.btn{margin-left:auto;background:var(--mint);color:#06251f;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:.18s}
.btn:hover{background:var(--mint2);box-shadow:0 0 20px var(--mint-soft)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:13px 20px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:520px){.title{font-size:22px}.word{padding:17px}}
</style>
</head>

<div class="wrap">
  <div class="head">
    <div class="badge">김가경 국어 연구소</div>
    <div class="title">용비어천가 125장 <b>복습 시험</b></div>
    <div class="sub">고전 문법 · 중세 국어 · 용비어천가 125장(勿忘章)</div>
    <div class="namebar"><input type="text" id="studentName" placeholder="이름을 입력하세요"></div>
  </div>
  <div id="quiz"></div>
</div>
<div class="bar"><div class="barwrap">
  <div class="prog">
    <svg class="ring" viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"></circle><circle class="fg" id="ring" cx="20" cy="20" r="16" stroke-dasharray="0,100" transform="rotate(-90 20 20)" pathLength="100"></circle></svg>
    <div><div class="progtxt"><span id="ptxt">0</span>%</div><div class="proglbl">정답률</div></div>
  </div>
  <button class="btn" onclick="submitAll()">채점 및 제출</button>
</div></div>
<div class="toast" id="toast"></div>

const st={}; // key wi-qi -> {answered,graded,correct,val}
let autoSubmitted=false, pendingSubmit=false, agTimer=null, subTimer=null;

function norm(s){return (s||'').toString().replace(/[\s.,'"·:;()\-]/g,'').toLowerCase();}
function totalQ(){return DATA.reduce((a,w)=>a+w.questions.length,0);}

function build(){
  const root=document.getElementById('quiz');
  DATA.forEach((w,wi)=>{
    const c=document.createElement('div'); c.className='word';
    let h='<div class="wordhd"><div class="wordno">'+(wi+1)+'</div><div class="wordlbl">아래 단어를 보고 물음에 답하세요</div></div>';
    h+='<div class="imgbox"><img src="'+w.img+'" alt="단어"></div>';
    w.questions.forEach((q,qi)=>{
      const id=wi+'-'+qi;
      h+='<div class="q" data-id="'+id+'"><div class="qtitle"><span class="qt">'+(q.type==='단답'?'단답':'복수')+'</span>'+q.q.replace(/</g,'&lt;')+'</div>';
      if(q.type==='단답'){
        h+='<div class="sa"><input type="text" id="i-'+id+'" data-id="'+id+'" placeholder="답 입력 후 Enter" onkeydown="saKey(event,\''+id+'\')" oninput="saInput(\''+id+'\')"></div><div class="ansfb" id="fb-'+id+'"></div>';
      }else{
        h+='<div class="opts" id="o-'+id+'">';
        q.opts.forEach((o,oi)=>{ h+='<div class="opt" data-oi="'+oi+'" onclick="toggle(\''+id+'\','+oi+')"><div class="box"><span class="material-symbols-outlined">check</span></div><div>'+o.replace(/</g,'&lt;')+'</div></div>'; });
        h+='</div>';
      }
      h+='</div>';
    });
    c.innerHTML=h; root.appendChild(c);
  });
}

function saInput(id){ clearTimeout(subTimer); const el=document.getElementById('i-'+id); el.classList.remove('correct','wrong'); document.getElementById('fb-'+id).classList.remove('show'); st[id]={answered:!!el.value.trim(),graded:false,correct:false,val:el.value}; scheduleAG(); updateProg(); }
function saKey(e,id){ if(e.key==='Enter'){ e.preventDefault(); gradeSA(id); const inps=[...document.querySelectorAll('.sa input')]; const k=inps.indexOf(document.getElementById('i-'+id)); for(let j=k+1;j<inps.length;j++){ if(!inps[j].readOnly){inps[j].focus();break;} } } }
function gradeSA(id){ const [wi,qi]=id.split('-').map(Number); const q=DATA[wi].questions[qi]; const el=document.getElementById('i-'+id); const v=el.value.trim(); if(!v)return; const ok=q.ans.some(a=>norm(a)===norm(v)); el.classList.remove('correct','wrong'); el.classList.add(ok?'correct':'wrong'); el.readOnly=ok; st[id]={answered:true,graded:true,correct:ok,val:v}; const fb=document.getElementById('fb-'+id); fb.classList.add('show'); fb.innerHTML= ok? '<span class="ok">정답</span>' : '<span class="no">오답</span> · 정답: '+q.ans[0]; updateProg(); maybeSubmit(); }

function toggle(id,oi){ const [wi,qi]=id.split('-').map(Number); if(st[id]&&st[id].graded)return; const el=document.querySelector('#o-'+id+' .opt[data-oi="'+oi+'"]'); el.classList.toggle('on'); const sel=[...document.querySelectorAll('#o-'+id+' .opt.on')].length; st[id]={answered:sel>0,graded:false,correct:false}; clearTimeout(subTimer); scheduleAG(); updateProg(); }
function gradeCB(id){ const [wi,qi]=id.split('-').map(Number); const q=DATA[wi].questions[qi]; const opts=[...document.querySelectorAll('#o-'+id+' .opt')]; const chosen=opts.filter(o=>o.classList.contains('on')).map(o=>+o.dataset.oi); if(chosen.length===0)return; const correct=q.ai.slice().sort().join(','); const ok = chosen.slice().sort().join(',')===correct; opts.forEach(o=>{ const oi=+o.dataset.oi; o.classList.add('graded'); o.classList.remove('on'); const isC=q.ai.includes(oi), chose=chosen.includes(oi); if(isC&&chose)o.classList.add('gc'); else if(!isC&&chose)o.classList.add('gw'); else if(isC&&!chose){o.classList.add('gc'); o.insertAdjacentHTML('beforeend','<span class="miss">정답</span>');} }); st[id]={answered:true,graded:true,correct:ok}; updateProg(); maybeSubmit(); }

function isAnswered(id){ return st[id]&&st[id].answered; }
function scheduleAG(){ clearTimeout(agTimer); agTimer=setTimeout(function(){ let allA=true; DATA.forEach((w,wi)=>w.questions.forEach((q,qi)=>{ if(!isAnswered(wi+'-'+qi))allA=false; })); if(allA) gradeAll(); },800); }
function gradeAll(){ DATA.forEach((w,wi)=>w.questions.forEach((q,qi)=>{ const id=wi+'-'+qi; if(st[id]&&st[id].answered&&!st[id].graded){ q.type==='단답'?gradeSA(id):gradeCB(id); } })); }
function allGraded(){ let g=true; DATA.forEach((w,wi)=>w.questions.forEach((q,qi)=>{ if(!(st[wi+'-'+qi]&&st[wi+'-'+qi].graded))g=false; })); return g; }

function updateProg(){ let c=0; Object.values(st).forEach(s=>{if(s.graded&&s.correct)c++;}); const t=totalQ(); const p=t?Math.round(c/t*100):0; document.getElementById('ptxt').textContent=p; document.getElementById('ring').setAttribute('stroke-dasharray',p+',100'); }

function resultData(){ const name=document.getElementById('studentName').value.trim(); let tot=0,cor=0; const wrongs=[]; DATA.forEach((w,wi)=>w.questions.forEach((q,qi)=>{ const id=wi+'-'+qi; tot++; const s=st[id]; if(s&&s.graded&&s.correct)cor++; else wrongs.push((wi+1)+'-'+(qi+1)); })); return {studentName:name, sections:[{work:'용비어천가 125장(고전문법)', total:tot, correct:cor, rate:tot?Math.round(cor/tot*100):0, wrongs:wrongs.slice(0,20)}], totalBlanks:tot, totalCorrect:cor, totalRate:tot?Math.round(cor/tot*100):0}; }

function maybeSubmit(){ if(autoSubmitted)return; clearTimeout(subTimer); if(!allGraded())return; subTimer=setTimeout(function(){ if(autoSubmitted||!allGraded())return; const nm=document.getElementById('studentName').value.trim(); if(!nm){pendingSubmit=true; toast('모두 채점됐어요! 이름을 입력하면 자동 제출됩니다.');return;} doSubmit(); },2500); }
function submitAll(){ let unA=0; DATA.forEach((w,wi)=>w.questions.forEach((q,qi)=>{ if(!isAnswered(wi+'-'+qi))unA++; })); if(unA>0){ gradeAll(); if(unA>0){toast('아직 답하지 않은 문항이 '+unA+'개 있어요.');} } gradeAll(); const nm=document.getElementById('studentName').value.trim(); if(!nm){toast('이름을 입력해 주세요.'); document.getElementById('studentName').focus(); return;} doSubmit(); }
function doSubmit(){ autoSubmitted=true; pendingSubmit=false; const d=resultData(); if(SCRIPT_URL){ document.getElementById('sform').action=SCRIPT_URL; document.getElementById('sdata').value=JSON.stringify(d); document.getElementById('sform').submit(); } toast('제출되었습니다! ('+d.totalRate+'%)'); }

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),3200); }
document.getElementById('studentName').addEventListener('input',function(){ if(pendingSubmit)maybeSubmit(); });
build(); updateProg();
</script>
